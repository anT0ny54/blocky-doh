connectIPVersion: v4
bootstrapDns:
  - upstream: https://root.hagezi.org/dns-query
    ips:
      - 188.34.161.210
  - upstream: https://wurzn.hagezi.org/dns-query
    ips:
      - 159.69.155.94
  - upstream: https://juuri.hagezi.org/dns-query
    ips:
      - 95.217.163.17
upstreams:
  strategy: random
  timeout: 1200ms
  groups:
    default:
      - https://root.hagezi.org/dns-query
      - https://wurzn.hagezi.org/dns-query
      - https://juuri.hagezi.org/dns-query
ports:
  dns: 127.0.0.1:5353
  http: 127.0.0.1:8053
caching:
  maxItemsCount: 16384
  prefetching: false
  cacheTimeNegative: 5m
# Blocky's default when queryLog.type is unset is "console", which builds a log
# entry for every query even though log.level=warn then discards it. "none"
# makes Blocky skip that per-query work entirely.
queryLog:
  type: none
log:
  level: warn
  format: text
  timestamp: true
  privacy: true