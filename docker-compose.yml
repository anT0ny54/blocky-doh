services:
  hagezi-doh:
    build: .
    ports:
      - "8080:8080"
    # Local compose runs without a trusted reverse proxy in front: spoofable
    # X-Forwarded-For headers must be ignored, so per-client rate limiting
    # stays keyed on the real peer address. (The production image defaults to
    # TRUST_PROXY=true because SnapDeploy's load balancer is the trusted proxy.)
    environment:
      TRUST_PROXY: "false"
    restart: unless-stopped
